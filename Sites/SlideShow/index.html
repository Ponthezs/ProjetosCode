<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <title>SlideShow</title>
</head>
<body>
    <div class="scene">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="container-slide" id="containerSlide">
            <div class="stage">
                <button class="action-button" id="previous" aria-label="Slide anterior">&laquo;</button>
                <div class="container-items" id="container-items"></div>
                <button class="action-button" id="next" aria-label="Próximo slide">&raquo;</button>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="playPause" aria-label="Pausar apresentação" title="Pausar/Reproduzir">⏸</button>
                <div class="dots" id="dots"></div>
                <button class="ctrl-btn" id="fullscreenBtn" aria-label="Tela cheia" title="Tela cheia">⛶</button>
            </div>
        </div>

        <p class="hint">Use as setas do teclado, arraste ou toque nos pontos &middot; espaço pausa &middot; F entra em tela cheia</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
