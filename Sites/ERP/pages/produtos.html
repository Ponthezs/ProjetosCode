<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Fluxen ERP</title>
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('erp_settings')||'{}');if(s.theme==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="../assets/logo/fluxen-favicon.png">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .field-with-link { display: flex; flex-direction: column; gap: 4px; }
    .field-link-btn { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--brand-700); background: none; border: none; cursor: pointer; padding: 0; }
    .field-link-btn:hover { text-decoration: underline; }
    .checkbox-inline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div class="main-col">
      <div id="header-root"></div>
      <main class="page-content" id="pageContent">
        <div class="page-header">
          <div class="page-title">
            <h1>Produtos</h1>
            <span class="page-subtitle">Cadastro de produtos e categorias</span>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="btnNovoProduto"><i class="fa-solid fa-plus"></i> Novo produto</button>
            <button class="btn btn-secondary" id="btnNovaCategoria" hidden><i class="fa-solid fa-plus"></i> Nova categoria</button>
          </div>
        </div>

        <div class="tabs">
          <button type="button" class="tab-btn active" data-tab="produtos">Produtos</button>
          <button type="button" class="tab-btn" data-tab="categorias">Categorias</button>
        </div>

        <div id="panelProdutos">
          <div class="table-card">
            <div class="table-toolbar">
              <div class="tt-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="input" id="searchInput" placeholder="Buscar por nome, SKU ou código de barras...">
              </div>
              <div class="tt-filters">
                <select class="input" id="filterCategory">
                  <option value="">Categoria (todas)</option>
                </select>
                <select class="input" id="filterStatus">
                  <option value="">Status (todos)</option>
                  <option value="ativo">Ativo</option>
                  <option value="inativo">Inativo</option>
                </select>
                <label class="checkbox-inline"><input type="checkbox" id="filterLowStock"> Somente estoque baixo</label>
              </div>
            </div>
            <div id="tableContainerProdutos"></div>
          </div>
        </div>

        <div id="panelCategorias" hidden>
          <div class="table-card">
            <div id="tableContainerCategorias"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/core/utils.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/components.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/services/customerService.js"></script>
  <script src="../js/services/supplierService.js"></script>
  <script src="../js/services/categoryService.js"></script>
  <script src="../js/services/productService.js"></script>
  <script src="../js/services/stockService.js"></script>
  <script src="../js/services/salesService.js"></script>
  <script src="../js/services/purchaseService.js"></script>
  <script src="../js/services/financialService.js"></script>
  <script src="../js/services/userService.js"></script>
  <script src="../js/services/companyService.js"></script>
  <script src="../js/core/seed-data.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/pages/produtos.js"></script>
</body>
</html>
