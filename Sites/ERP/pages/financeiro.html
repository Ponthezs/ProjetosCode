<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Fluxen ERP</title>
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('erp_settings')||'{}');if(s.theme==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="../assets/logo/fluxen-favicon.png">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .due-list { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-xs); margin-top: var(--space-4); }
    .due-list-header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; }
    .due-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border); }
    .due-row:last-child { border-bottom: none; }
    .due-row .due-icon { width: 34px; height: 34px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .due-row .due-icon.in { background: var(--success-100); color: var(--success-600); }
    .due-row .due-icon.out { background: var(--danger-100); color: var(--danger-600); }
    .due-row .due-info { flex: 1; min-width: 0; }
    .due-row .due-desc { font-size: 13.5px; font-weight: 600; }
    .due-row .due-meta { font-size: 12px; color: var(--text-muted); }
    .due-row .due-amount { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div class="main-col">
      <div id="header-root"></div>
      <main class="page-content" id="pageContent">
        <div class="page-header">
          <div class="page-title">
            <h1>Financeiro</h1>
            <span class="page-subtitle">Visão geral financeira da empresa</span>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="btnNovaCategoria" hidden><i class="fa-solid fa-plus"></i> Nova categoria</button>
          </div>
        </div>

        <div class="tabs">
          <button type="button" class="tab-btn active" data-tab="geral">Visão geral</button>
          <button type="button" class="tab-btn" data-tab="categorias">Categorias financeiras</button>
        </div>

        <div id="panelGeral">
          <div class="kpi-grid" id="kpiGrid"></div>

          <div class="chart-grid">
            <div class="chart-card wide">
              <div class="chart-title">Receitas x despesas</div>
              <div class="chart-sub">Valores realizados por mês — últimos 6 meses</div>
              <canvas id="chartRevenueExpense"></canvas>
            </div>
          </div>

          <div class="due-list">
            <div class="due-list-header">Contas vencendo hoje ou nos próximos 7 dias</div>
            <div id="dueListBody"></div>
          </div>
        </div>

        <div id="panelCategorias" hidden>
          <div class="table-card">
            <div id="tableContainerCategorias"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/components.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/services/customerService.js"></script>
  <script src="../js/services/supplierService.js"></script>
  <script src="../js/services/categoryService.js"></script>
  <script src="../js/services/productService.js"></script>
  <script src="../js/services/stockService.js"></script>
  <script src="../js/services/salesService.js"></script>
  <script src="../js/services/purchaseService.js"></script>
  <script src="../js/services/financialService.js"></script>
  <script src="../js/services/userService.js"></script>
  <script src="../js/services/companyService.js"></script>
  <script src="../js/core/seed-data.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/pages/financeiro.js"></script>
</body>
</html>
